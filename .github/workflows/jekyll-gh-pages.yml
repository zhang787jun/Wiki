name: Deploy Simiki to GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-build.txt
      - name: Install pinned build dependencies
        run: |
          python -m pip install --upgrade "pip==26.1.2" "setuptools==80.9.0" "wheel==0.45.1"
          python -m pip install --no-deps --no-build-isolation "simiki==1.6.2.3"
          python -m pip install --no-deps -r requirements-build.txt
      - name: Build site
        shell: bash
        run: |
          set -euo pipefail
          build_log="$(mktemp)"
          simiki g 2>&1 | tee "$build_log"
          if grep -Eq "pages failed|failed to generate" "$build_log"; then
            echo "Simiki reported page-generation failures."
            exit 1
          fi
          test -s output/index.html
          touch output/.nojekyll
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

  deploy:
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
