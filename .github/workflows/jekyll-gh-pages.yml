name: Deploy Simiki to GitHub Pages

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    permissions:
      contents: read
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install compatible build dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-deps -r requirements-build.txt
      - name: Build and validate site
        shell: bash
        run: |
          set -euo pipefail
          build_log="$(mktemp)"
          simiki g 2>&1 | tee "$build_log"
          if grep -Eq "pages failed|failed to generate" "$build_log"; then
            echo "Simiki reported page-generation failures."
            exit 1
          fi
          cp favicon.ico output/favicon.ico
          cp 404.html output/404.html
          touch output/.nojekyll
          python scripts/copy_legacy_assets.py
          python scripts/build_search_index.py
          python scripts/check_pages_build.py
          python scripts/check_redesign.py
          node scripts/check_search.cjs
          node --check themes/simple/static/js/space.js
      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

  deploy:
    if: github.event_name != 'pull_request'
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
