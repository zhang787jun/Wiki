<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{% block title %}Jim · 知识与实践{% endblock %}</title>
  <meta name="description" content="Jim 的个人知识空间。关于计算机科学、数据科学、产品与应用，以及战略和管理的长期笔记。">
  <link rel="icon" href="{{ site.root }}/static/images/mark.svg" type="image/svg+xml">
  <link rel="stylesheet" href="{{ site.root }}/static/css/style.css?v=20261019">
  <link rel="stylesheet" href="{{ site.root }}/static/css/tango.css">
  <script src="{{ site.root }}/static/js/theme.js?v=20261019"></script>
  <script defer src="{{ site.root }}/static/js/search-core.js?v=20261019"></script>
  <script defer src="{{ site.root }}/static/js/space.js?v=20261020"></script>
  {% block head %}{% endblock %}
</head>
<body data-search-index="{{ site.root }}/static/data/search-index.json">
  <a class="skip-link" href="#main">跳至正文</a>
  <header class="site-header">
    <div class="nav-shell">
      <a class="wordmark" href="https://zhang787jun.github.io/" aria-label="Jim 首页">Jim<span>.</span></a>
      <nav aria-label="主导航" class="main-nav">
        <a href="{{ site.root }}/" aria-current="page">知识库</a>
        <a href="https://zhang787jun.github.io/#projects">作品</a>
        <a href="https://zhang787jun.github.io/#about">关于</a>
      </nav>
      <div class="nav-tools"><button class="search-trigger" data-search-open aria-label="搜索知识库"><span class="search-icon" aria-hidden="true"></span><span class="search-label">搜索</span><kbd>⌘ K</kbd></button><button class="icon-button theme-toggle" data-theme-toggle aria-label="切换深浅主题" title="切换深浅主题">◐</button></div>
    </div>
  </header>
  <main id="main">{% block container %}{{ page.content }}{% endblock %}</main>
  <footer class="site-footer wrap"><a class="wordmark" href="https://zhang787jun.github.io/">Jim<span>.</span></a><p>持续学习，认真记录。</p><div><a href="https://github.com/zhang787jun">GitHub ↗</a><a href="mailto:zhang787jun@gmail.com">联系我 ↗</a></div></footer>
  {% include "search.html" %}
  <div class="sr-only" id="announcement" aria-live="polite"></div>
</body>
</html>
